name: Release manual install ZIP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify release inputs
        run: npm run check && npm run pack:check

      - name: Build manual install archive
        env:
          GOVUK_EXPECTED_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: npm run release:archive

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: govuk-design-md-manual-install
          path: release/*.zip
          if-no-files-found: error

      - name: Attach archive to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/*.zip --clobber
